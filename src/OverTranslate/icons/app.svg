  <rect x="23" y="23" width="466" height="466" rx="109" fill="none" stroke="#31506F" stroke-width="3" stroke-opacity="0.92"/>
  <g aria-hidden="true" transform="matrix(1, 0, 0, 1, -17.012491, -32.129486)">
    <rect x="68" y="98" width="286" height="306" rx="52" fill="#12243A" stroke="#2A4563" stroke-width="4"/>
    <path d="M70 158H352" stroke="#2A4563" stroke-width="4"/>
    <circle cx="102" cy="128" r="8" fill="#4A6483"/>
    <circle cx="128" cy="128" r="8" fill="#4A6483"/>
    <circle cx="154" cy="128" r="8" fill="#4A6483"/>
    <rect x="98" y="190" width="132" height="14" rx="7" fill="#536A86"/>
    <rect x="98" y="220" width="184" height="14" rx="7" fill="#405570"/>
    <rect x="98" y="250" width="152" height="14" rx="7" fill="#344861"/>
  </g>
  <g style="" transform="matrix(1.043643, 0, 0, 1.043643, -27.720106, -20.15337)">
    <g filter="url(#panel-shadow)">
      <rect x="138" y="120" width="326" height="338" rx="62" fill="url(#panel)" stroke="url(#accent)" stroke-width="8"/>
    </g>
    <rect x="149" y="131" width="304" height="316" rx="51" fill="none" stroke="#2C7890" stroke-width="2" opacity="0.5"/>
    <g id="ot-mark" filter="url(#mark-shadow)" aria-hidden="true">
      <path fill="url(#mark-o)" fill-rule="evenodd" stroke="#56E9F2" stroke-width="2" stroke-linejoin="round" d="M234 170H272L312 212V302C312 324 294 342 272 342H230C207 342 188 323 188 300V218C188 191 207 170 234 170ZM238 202H258L280 225V292C280 302 272 310 262 310H240C229 310 220 301 220 290V226C220 212 228 202 238 202Z"/>
      <path fill="url(#mark-t)" stroke="#5CEBF3" stroke-width="2" stroke-linejoin="round" d="M280 170H424L400 202H372V342H336V202H308L280 170Z"/>
      <path d="M230 180H264L294 210" fill="none" stroke="url(#sheen-o)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M298 180H410" fill="none" stroke="url(#sheen-t)" stroke-width="4" stroke-linecap="round"/>
    </g>
    <path d="M170 260H432" stroke="url(#scan)" stroke-width="10" opacity="0.32" filter="url(#scan-glow)"/>
    <path d="M176 260H426" stroke="url(#scan)" stroke-width="3"/>
    <g aria-hidden="true">
      <rect x="196" y="382" width="184" height="15" rx="7.5" fill="#52EAF5" fill-opacity="0.66"/>
      <rect x="196" y="410" width="138" height="15" rx="7.5" fill="#52EAF5" fill-opacity="0.36"/>
    </g>
  </g>
</svg>
