<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="16 16 480 480" role="img" aria-labelledby="title desc">
  <title id="title">OverTranslate</title>
  <desc id="desc">The OT monogram on an OCR translation panel with a scan beam and translated text lines.</desc>
  <defs>
    <filter id="edge-feather" x="16" y="16" width="480" height="480" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
    <mask id="tile-mask" x="0" y="0" width="512" height="512" maskUnits="userSpaceOnUse" mask-type="alpha">
      <rect x="20.5" y="20.5" width="471" height="471" rx="111.5" fill="white" filter="url(#edge-feather)"/>
    </mask>
    <linearGradient id="tile" x1="66" y1="38" x2="454" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#19334F"/>
      <stop offset="0.46" stop-color="#0C1A2B"/>
      <stop offset="1" stop-color="#050B13"/>
    </linearGradient>
    <linearGradient id="panel" x1="152" y1="124" x2="446" y2="454" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10243A"/>
      <stop offset="1" stop-color="#050C15"/>
    </linearGradient>
    <linearGradient id="accent" x1="152" y1="128" x2="448" y2="446" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8AFAFF"/>
      <stop offset="0.5" stop-color="#49E7F2"/>
      <stop offset="1" stop-color="#20C6DE"/>
    </linearGradient>
    <linearGradient id="mark-o" x1="192" y1="168" x2="310" y2="334" gradientUnits="userSpaceOnUse">
      <stop stop-color="#82F7FC"/>
      <stop offset="0.48" stop-color="#34CFDD"/>
      <stop offset="1" stop-color="#1595B1"/>
    </linearGradient>
    <linearGradient id="mark-t" x1="286" y1="168" x2="422" y2="338" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B0FDFF"/>
      <stop offset="0.48" stop-color="#4CE8F2"/>
      <stop offset="1" stop-color="#1EBBD4"/>
    </linearGradient>
    <linearGradient id="sheen-o" x1="226" y1="0" x2="300" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E6FEFF" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#E6FEFF" stop-opacity="0.18"/>
      <stop offset="0.72" stop-color="#E6FEFF" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#E6FEFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen-t" x1="294" y1="0" x2="410" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E6FEFF" stop-opacity="0"/>
      <stop offset="0.24" stop-color="#E6FEFF" stop-opacity="0.15"/>
      <stop offset="0.72" stop-color="#E6FEFF" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#E6FEFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="172" y1="0" x2="432" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#70F4FB" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#70F4FB" stop-opacity="0.52"/>
      <stop offset="0.5" stop-color="#D2FEFF" stop-opacity="0.96"/>
      <stop offset="0.8" stop-color="#70F4FB" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#70F4FB" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientTransform="translate(410 78) rotate(134) scale(204)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#69F2FF" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#69F2FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="panel-shadow" x="112" y="90" width="384" height="410" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000711" flood-opacity="0.62"/>
    </filter>
    <filter id="mark-shadow" x="166" y="150" width="292" height="224" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#00050B" flood-opacity="0.78"/>
    </filter>
    <filter id="scan-glow" x="158" y="244" width="288" height="34" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
